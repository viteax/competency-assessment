services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: competency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d competency"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/competency
      # Конфигурация для локальной разработки и демо. Для сервера — docker-compose.prod.yml.
      ENVIRONMENT: dev
      # В dev ключ подписи случайный в каждом процессе — нужен один процесс.
      WEB_CONCURRENCY: 1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
