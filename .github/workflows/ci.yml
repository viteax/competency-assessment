name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  e2e:
    # Браузерные сценарии: настоящий сервер и Chromium (tests/e2e).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e -q

  audit:
    # Известные уязвимости в зависимостях (база OSV/PyPI), по точным версиям из uv.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip --require-hashes

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: competency
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/competency
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run python -m scripts.seed

  docker:
    # Собирает образ на каждом пуше и проверяет, что он запускается. На тегах v* публикует
    # его в GitHub Container Registry: ghcr.io/<владелец>/competency-assessment.
    runs-on: ubuntu-latest
    needs: [test, e2e, migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Simulate a Windows checkout (CRLF in scripts)
        # Образ должен запускаться, даже если скрипты пришли с концами строк Windows.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: sed -i 's/$/\r/' scripts/*.sh
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/competency-assessment
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: competency-assessment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 --read-only --tmpfs /tmp \
            -e ENVIRONMENT=prod -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite:////tmp/smoke.db competency-assessment:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          docker logs app
          curl -fsS localhost:8000/ready
          curl -fsS localhost:8000/ui/ | grep -q "js/main.js"
          docker exec app id -u | grep -qx 10001  # не root
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
