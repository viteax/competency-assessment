name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  audit:
    # Известные уязвимости в зависимостях (база OSV/PyPI), по точным версиям из uv.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip --require-hashes

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: competency
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/competency
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run python -m scripts.seed
