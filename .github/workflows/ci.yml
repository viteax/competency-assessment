name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Запуск кнопкой Release (release.yml): тег, поставленный токеном Actions, CI сам не запускает.
  workflow_dispatch:

# Версия Ubuntu закреплена: смена образа «ubuntu-latest» не должна внезапно ломать сборку
# (например, установку браузера для e2e). Обновлять осознанно.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          # Задачи идут параллельно: кэш зависимостей сохраняет одна, остальные только читают.
          save-cache: ${{ github.job == 'test' }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -n auto

  e2e:
    # Браузерные сценарии: настоящий сервер и Chromium (tests/e2e).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          # Задачи идут параллельно: кэш зависимостей сохраняет одна, остальные только читают.
          save-cache: ${{ github.job == 'test' }}
      - run: uv sync --locked
      # Браузер – из кэша по версии Playwright. Системные пакеты (--with-deps) не ставим: на
      # раннере они уже есть, а apt-зеркало иногда отвечает минутами.
      - id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: uv run playwright install --only-shell chromium
      # Каждый тест поднимает свой сервер и свою копию базы, поэтому тесты идут параллельно.
      - run: uv run pytest -m e2e -q -n auto

  frontend:
    # ESLint для веб-интерфейса (app/static); сборки нет, node нужен только для проверки.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings 0
      - run: npm audit --audit-level=high

  audit:
    # Известные уязвимости в зависимостях (база OSV/PyPI), по точным версиям из uv.lock.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          # Задачи идут параллельно: кэш зависимостей сохраняет одна, остальные только читают.
          save-cache: ${{ github.job == 'test' }}
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip --require-hashes

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: competency
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/competency
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          # Задачи идут параллельно: кэш зависимостей сохраняет одна, остальные только читают.
          save-cache: ${{ github.job == 'test' }}
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run python -m scripts.seed

  docker:
    # Собирает образ на каждом пуше и проверяет, что он запускается. Публикует его в GitHub
    # Container Registry (ghcr.io/<владелец>/competency-assessment): на тегах v* – как версию
    # для прода, в main – как sha-<коммит> для демо-стенда.
    runs-on: ubuntu-24.04
    needs: [test, e2e, frontend, migrations]
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Simulate a Windows checkout (CRLF in scripts)
        # Образ должен запускаться, даже если скрипты пришли с концами строк Windows.
        # Опубликованный образ собирается из нетронутых файлов (шаг Restore ниже).
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: sed -i 's/$/\r/' scripts/*.sh
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/competency-assessment
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: competency-assessment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 --read-only --tmpfs /tmp \
            -e ENVIRONMENT=prod -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite:////tmp/smoke.db competency-assessment:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          docker logs app
          curl -fsS localhost:8000/ready
          curl -fsS localhost:8000/ui/ | grep -q "js/main.js"
          docker exec app id -u | grep -qx 10001  # не root
      - name: Restore scripts
        if: env.PUBLISH == 'true'
        run: git checkout -- scripts
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # --- Доставка на сервер (docs/deploy.md, раздел «Автоматическое обновление») -------------
  # Включается переменной репозитория DEPLOY_HOST; без нее задачи пропускаются.
  # Ключ SSH дает только запуск deploy/remote-deploy.sh, shell на сервере он не открывает.

  deploy-demo:
    # Каждый зеленый пуш в main – на демо-стенд, образом sha-<коммит> из задачи docker.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: [docker, audit]
    runs-on: ubuntu-24.04
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    concurrency: deploy-demo
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Ключ – одна строка base64 из deploy/setup-cd.sh (переносы и пробелы при копировании
          # не мешают) или обычный файл ключа, у которого убираем CR и пробелы по краям строк.
          if printf '%s' "$SSH_KEY" | grep -q BEGIN; then
            format=PEM
            printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          else
            format=base64
            printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d || true
          fi > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Сведения о ключе без его содержимого: по ним видно, что именно вставлено в секрет.
          echo "DEPLOY_SSH_KEY: формат $format, $(printf '%s' "$SSH_KEY" | wc -c) символов," \
            "$(printf '%s\n' "$SSH_KEY" | wc -l) строк; ожидается base64 около 550 символов"
          ssh-keygen -l -f ~/.ssh/id_ed25519 || {
            echo "::error::DEPLOY_SSH_KEY не читается: вставьте строку из вывода deploy/setup-cd.sh"
            exit 1
          }
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@${{ vars.DEPLOY_HOST }} demo "${GITHUB_SHA::7}"
      - name: Check
        if: vars.DEMO_URL != ''
        run: |
          for _ in $(seq 1 30); do curl -fsS "${{ vars.DEMO_URL }}/ready" && exit 0; sleep 5; done
          exit 1

  deploy-prod:
    # Тег v1.2.3 – на прод, после ручного подтверждения в окружении prod
    # (Settings → Environments → prod → Required reviewers).
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_HOST != ''
    needs: [docker, audit]
    runs-on: ubuntu-24.04
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    concurrency: deploy-prod
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Ключ – одна строка base64 из deploy/setup-cd.sh (переносы и пробелы при копировании
          # не мешают) или обычный файл ключа, у которого убираем CR и пробелы по краям строк.
          if printf '%s' "$SSH_KEY" | grep -q BEGIN; then
            format=PEM
            printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          else
            format=base64
            printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d || true
          fi > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Сведения о ключе без его содержимого: по ним видно, что именно вставлено в секрет.
          echo "DEPLOY_SSH_KEY: формат $format, $(printf '%s' "$SSH_KEY" | wc -c) символов," \
            "$(printf '%s\n' "$SSH_KEY" | wc -l) строк; ожидается base64 около 550 символов"
          ssh-keygen -l -f ~/.ssh/id_ed25519 || {
            echo "::error::DEPLOY_SSH_KEY не читается: вставьте строку из вывода deploy/setup-cd.sh"
            exit 1
          }
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@${{ vars.DEPLOY_HOST }} prod "${GITHUB_REF_NAME#v}"
      - name: Check
        if: vars.PROD_URL != ''
        run: |
          for _ in $(seq 1 30); do curl -fsS "${{ vars.PROD_URL }}/ready" && exit 0; sleep 5; done
          exit 1
